<title>Deutschstube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a one-column school workbook. Sticky header with learner switcher, a tab strip, then "Heft" sheets with ruled lines.
   Gender colours follow the classic German classroom code: der = blue, die = red, das = green. */
:root{
  --paper:#f4f6fa; --sheet:#ffffff; --ink:#1a2233; --ink-2:#566075; --line:#dbe1ec; --rule:#e9eef8;
  --accent:#2a56d0; --accent-ink:#ffffff; --accent-soft:#e6ecfb;
  --gold:#c98a00; --go:#14875a; --go-soft:#e3f4ec; --stop:#c83333; --stop-soft:#fbe7e7; --wait:#b9770a; --wait-soft:#fdf1dc;
  --der:#2a56d0; --die:#c83333; --das:#14875a;
  --chip:#edf1f8;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151f; --sheet:#181f2d; --ink:#e7ebf4; --ink-2:#9ba6bc; --line:#2a3346; --rule:#1f2738;
  --accent:#86a6ff; --accent-ink:#0c1220; --accent-soft:#1f2a45;
  --gold:#ffc54a; --go:#43d08f; --go-soft:#14301f; --stop:#ff7373; --stop-soft:#3a1a1d; --wait:#ffb547; --wait-soft:#3a2a12;
  --der:#86a6ff; --die:#ff7f7f; --das:#4fd69a; --chip:#222b3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151f; --sheet:#181f2d; --ink:#e7ebf4; --ink-2:#9ba6bc; --line:#2a3346; --rule:#1f2738;
  --accent:#86a6ff; --accent-ink:#0c1220; --accent-soft:#1f2a45;
  --gold:#ffc54a; --go:#43d08f; --go-soft:#14301f; --stop:#ff7373; --stop-soft:#3a1a1d; --wait:#ffb547; --wait-soft:#3a2a12;
  --der:#86a6ff; --die:#ff7f7f; --das:#4fd69a; --chip:#222b3d; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:.2px}
.brand b i{font-style:normal;color:var(--accent)}
.brand small{color:var(--ink-2);font-size:.85rem}
.who{display:flex;gap:8px;align-items:center}
.who select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--sheet);max-width:46vw}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink-2);font-weight:600;padding:7px 12px;border-radius:999px;font-size:.95rem}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a:hover:not([aria-current]){background:var(--chip);color:var(--ink)}

main{padding-block:20px 60px;display:grid;gap:18px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-color:var(--sheet)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.de{font-weight:600}
.mono{font-family:var(--mono);font-size:.85rem}

.btn{border:1px solid var(--line);background:var(--sheet);padding:9px 15px;border-radius:11px;font-weight:600;display:inline-flex;gap:7px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.big{padding:13px 20px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--stop);border-color:var(--stop)}
.say{border:1px solid var(--line);background:var(--chip);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;flex:0 0 auto;padding:0}
.say:hover{border-color:var(--accent)}
.say svg{width:16px;height:16px;fill:var(--accent)}
.say.slow svg{opacity:.65}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 11px;font-size:.85rem;font-weight:600;border:1px solid transparent}
button.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.level{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;color:var(--accent)}
.meter{height:10px;background:var(--chip);border-radius:999px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.skill{display:grid;grid-template-columns:7.5rem 1fr 2.6rem;gap:10px;align-items:center;font-size:.92rem}
.skill .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

.mode{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:4px}
.mode:hover{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-family:var(--display);font-size:1.08rem;font-weight:600}

.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.vcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px;background:var(--sheet)}
.vcard .top{display:flex;gap:8px;align-items:center}
.vcard .ex{font-size:.88rem;color:var(--ink-2)}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)}

.line{display:flex;gap:10px;align-items:flex-start}
.line .who-tag{font-weight:700;font-size:.82rem;min-width:4.5rem;color:var(--ink-2);padding-top:7px}
.line .txt{display:grid;gap:1px;min-width:0}
.do,.dont{border-radius:12px;padding:12px;display:grid;gap:6px}
.do{background:var(--go-soft)} .dont{background:var(--stop-soft)}
.do h3{color:var(--go)} .dont h3{color:var(--stop)}
ul.clean{margin:0;padding-left:1.1rem;display:grid;gap:4px}

/* Quiz */
.q{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--chip);display:block}
.dots i.ok{background:var(--go)} .dots i.no{background:var(--stop)} .dots i.mid{background:var(--wait)} .dots i.now{outline:2px solid var(--accent)}
.prompt{font-size:1.25rem;font-weight:600}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opt{border:1.5px solid var(--line);background:var(--sheet);padding:12px 14px;border-radius:12px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--go);background:var(--go-soft)}
.opt.wrong{border-color:var(--stop);background:var(--stop-soft)}
.art{display:flex;gap:10px;flex-wrap:wrap}
.art button{flex:1 1 90px;font-family:var(--display);font-size:1.4rem;font-weight:700;padding:14px;border-radius:14px;border:2px solid currentColor;background:var(--sheet)}
.art .der{color:var(--der)} .art .die{color:var(--die)} .art .das{color:var(--das)}
.bigword{font-family:var(--display);font-size:2.2rem;font-weight:600;text-align:center}
input.text,textarea,select.text{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);background:var(--sheet)}
input.text:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{min-height:140px;resize:vertical}
.umlauts{display:flex;gap:6px}
.umlauts button{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-weight:700}
.tiles{display:flex;gap:7px;flex-wrap:wrap;min-height:46px;padding:8px;border-radius:12px;border:1.5px dashed var(--line)}
.tiles.pool{border-style:solid;background:var(--chip)}
.tile{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);font-weight:600}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.fb.right{background:var(--go-soft)} .fb.almost{background:var(--wait-soft)} .fb.wrong{background:var(--stop-soft)}
.fb b.t{font-family:var(--display);font-size:1.15rem}
.fb.right b.t{color:var(--go)} .fb.almost b.t{color:var(--wait)} .fb.wrong b.t{color:var(--stop)}
.mic{width:64px;height:64px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mic svg{width:26px;height:26px;fill:currentColor}
.mic.on{background:var(--stop);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.heard{font-size:1.05rem}
.heard .hit{color:var(--go);font-weight:700} .heard .miss{color:var(--stop);text-decoration:underline wavy}
.grade{font-family:var(--display);font-size:4rem;font-weight:700;line-height:1}
.timer{font-family:var(--mono);font-size:1.1rem;font-weight:500}

/* Chat */
.chat{display:grid;gap:10px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:min(85%,560px);padding:10px 13px;border-radius:14px;display:grid;gap:5px}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.lotte{justify-self:start;background:var(--chip);border-bottom-left-radius:4px}
.msg .en{font-size:.88rem;color:var(--ink-2)}
.msg .corr{font-size:.88rem;border-left:3px solid var(--wait);padding-left:8px}
.msg .tip{font-size:.88rem;border-left:3px solid var(--go);padding-left:8px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;height:48px}

table.kb{width:100%;border-collapse:collapse;font-size:.93rem}
table.kb td,table.kb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.kb th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.str{display:inline-flex;gap:2px}
.str i{width:7px;height:7px;border-radius:2px;background:var(--chip);display:block}
.str i.f{background:var(--go)}
.scroll{overflow-x:auto}

.board{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:2rem 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.avatar{width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--display)}
.loading{display:flex;gap:12px;align-items:center;color:var(--ink-2)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--chip);border-top-color:var(--accent);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{background:var(--wait-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
label.f{display:grid;gap:5px;font-weight:600;font-size:.93rem}
label.f span.h{font-weight:400;color:var(--ink-2);font-size:.85rem}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:600;padding:0 6px;font-size:1.05rem}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:11px;font-family:var(--body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){h1{font-size:1.55rem}.level{font-size:2.4rem}.skill{grid-template-columns:6rem 1fr 2.2rem}.sheet{padding:14px}}
</style>

<header class="top"><div class="wrap">
  <div class="bar">
    <div class="brand"><b>Deutsch<i>stube</i></b><small>mit Coach Lotte</small></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="view">
  <section class="sheet"><div class="loading"><div class="spin"></div><span>Lotte schließt die Tür auf … (opening your classroom)</span></div></section>
</main>

<script>
"use strict";
/* ---------------- tiny helpers ---------------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2), v);
    else if (k==='style') el.style.cssText = v;
    else if (k==='value') el.value = v;
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null || c===false) continue; el.append(c instanceof Node ? c : String(c)); }
  return el;
}
const $ = s => document.querySelector(s);
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : 0;
const rid = () => Math.random().toString(36).slice(2,10);
const shuffle = a => { a=[...a]; for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
function today(d=new Date()){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function addDays(ds,n){ const d=new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return today(d); }
function mondayOf(ds=today()){ const d=new Date(ds+'T12:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return today(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
const norm = s => String(s||'').toLowerCase().normalize('NFC').replace(/[„“”"'’‚.,!?;:()¿¡«»…–—\-]/g,' ').replace(/\s+/g,' ').trim();
const loose = s => norm(s).replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
const sim = (a,b) => { a=loose(a); b=loose(b); const L=Math.max(a.length,b.length); return L? 1-lev(a,b)/L : 1; };
function toast(msg){ const t=h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }
const ICON_SAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/></svg>';
function svgBtn(cls, svg, label, onclick){ const b=h('button',{class:cls,type:'button','aria-label':label,title:label,onclick}); b.innerHTML=svg; return b; }
function sayBtn(text, opts={}){ return svgBtn('say'+(opts.slow?' slow':''), ICON_SAY, (opts.slow?'Slowly: ':'Hear: ')+text, (e)=>{ e.stopPropagation(); Voice.speak(text,{rate:opts.slow?0.6:undefined, who:opts.who}); }); }
function sayPair(text){ return h('span',{class:'row',style:'gap:4px'}, sayBtn(text), sayBtn(text,{slow:true})); }
function genderClass(de){ const m=String(de).match(/^(der|die|das)\s/i); return m ? 'g-'+m[1].toLowerCase() : ''; }

/* ---------------- CEFR + grades ---------------- */
const BANDS = ['A1','A2','B1','B2','C1','C2'];
function cefr(diff){ const i=clamp(Math.floor(diff/16.67),0,5); const within=(diff-i*16.67)/16.67; return {band:BANDS[i], sub:within<0.5?1:2, label:BANDS[i]+'.'+(within<0.5?1:2), pct:clamp(within,0,1), idx:i}; }
function bandToDiff(b){ return Math.max(0, BANDS.indexOf(b))*16.67; }
function note(pct){ // German school grades, 1 is best
  if (pct>=92) return {n:'1',w:'sehr gut'}; if (pct>=81) return {n:'2',w:'gut'}; if (pct>=67) return {n:'3',w:'befriedigend'};
  if (pct>=50) return {n:'4',w:'ausreichend'}; if (pct>=30) return {n:'5',w:'mangelhaft'}; return {n:'6',w:'ungenügend'}; }

/* ---------------- Speech ---------------- */
const Voice = {
  voices: [], SR: window.SpeechRecognition || window.webkitSpeechRecognition || null, srBroken: false,
  init(){ if(!('speechSynthesis' in window)) return; const load=()=>{ this.voices=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang)); }; load(); try{ speechSynthesis.addEventListener('voiceschanged', load); }catch(e){} },
  get canSpeak(){ return 'speechSynthesis' in window; },
  get canListen(){ return !!this.SR && !this.srBroken; },
  speak(text,{rate,who=0}={}){
    if(!this.canSpeak || !text) return Promise.resolve();
    try{ speechSynthesis.cancel(); }catch(e){}
    const u=new SpeechSynthesisUtterance(text); u.lang='de-DE';
    if(this.voices.length){ u.voice=this.voices[who % this.voices.length]; }
    if(who===1 && this.voices.length<2) u.pitch=0.7;
    u.rate = rate ?? (S.L?.voiceRate || 0.95);
    return new Promise(r=>{ u.onend=r; u.onerror=r; speechSynthesis.speak(u); });
  },
  listen(){
    return new Promise((res,rej)=>{
      let done=false; const r=new this.SR(); r.lang='de-DE'; r.maxAlternatives=3; r.interimResults=false;
      r.onresult=e=>{ done=true; res([...e.results[0]].map(a=>a.transcript)); };
      r.onerror=e=>{ if(done) return; done=true; if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)) this.srBroken=true; rej(e.error); };
      r.onend=()=>{ if(!done){ done=true; rej('no-speech'); } };
      try{ r.start(); }catch(e){ this.srBroken=true; rej('blocked'); }
    });
  }
};

/* ---------------- Storage: claude db when available, browser storage otherwise ---------------- */
const Store = {
  mode:'local', db:null, uid:null,
  async init(){
    const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
    const timeout = new Promise(r=>setTimeout(()=>r([null,null,null]),9000));
    const [db,user,sample] = await Promise.race([Promise.all([use('db'),use('user'),use('sample')]), timeout]);
    AI.s = sample || null;
    if (db && user){ try{ const id=await user.id(); if(id){ this.db=db; this.uid=id; this.mode='cloud'; } }catch(e){} }
  },

  async listLearners(){

    if (this.mode!=='cloud') return;

  },
  async board(){

    try{ const s=await this.db.collection('board').get(); return s.docs.map(d=>d.data()); }catch(e){ return []; }
  }
};

Rules: "answer" for mc/listen is the 0-based index of the correct option. Never reveal the answer inside the prompt. Keep explanations to one or two short sentences.`;
function validQ(q){
  if(!q||typeof q!=='object') return false;
  if(q.type==='mc'||q.type==='listen'){ if(!Array.isArray(q.options)||q.options.length<2) return false; if(typeof q.answer==='string'){ const i=q.options.findIndex(o=>norm(o)===norm(q.answer)); if(i<0) return false; q.answer=i; } return Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length; }
  if(q.type==='article') return ['der','die','das'].includes(String(q.answer).toLowerCase()) && q.word;
  if(q.type==='fill'||q.type==='translate') return q.prompt && q.answer;
  if(q.type==='spell') return !!q.say;
  if(q.type==='speak') return !!q.text;
  if(q.type==='order') return q.answer && q.answer.trim().split(/\s+/).length>=3;
  return false;
}
async function aiQuestions(mode, n){
  const L=S.L; const known=shuffle(L.kb).slice(0,40).map(k=>k.de).join('; ');
  const desc = MODES[mode]?.ai || MODES.mix.ai;
  const prompt = `You write German practice questions for a family German course run by "Coach Lotte".\n${learnerBrief(L)}\nTask: ${desc}\nMake exactly ${n} questions at the learner's level (slightly above is good). Mix social and business scenarios as configured. Some can reuse these already-learned items: ${known||'none yet'} — but most should be NEW material.\n${QSPEC}\nReply with ONLY a JSON array.`;
  const arr = await AI.json(prompt);
  const out = (Array.isArray(arr)?arr:[]).filter(validQ);
  if(!out.length) throw {code:'invalid_json'};
  return out.slice(0,n);
}

function bankQuestions(mode, n){

function kbQuestion(k){
  const L=S.L; const others=L.kb.filter(o=>o.id!==k.id && o.en && o.t===k.t);
  const art = k.de.match(/^(der|die|das)\s+(.+)$/i); const kinds=[];
  if(k.t==='w'){ if(art) kinds.push('article'); if(others.length>=3 && k.en) kinds.push('mc','mc2'); kinds.push('spell','speak'); }
  else { if(k.de.trim().split(/\s+/).length>=3) kinds.push('order'); kinds.push('speak'); if(k.en) kinds.push('translate'); }

  if(kind==='spell') return {...base,type:'spell',skill:'vocab',say:k.de,en:k.en};

function weekXp(L){ const mon=mondayOf(); const before=[...L.history].reverse().find(x=>x.d<mon); return L.xp-(before?before.xp:0); }
function touchDay(){

  if(L.lastDay!==t){ L.streak = (L.lastDay && daysBetween(L.lastDay,t)===1) ? L.streak+1 : 1; L.lastDay=t; }
  const snap={d:t,diff:Math.round(L.diff*10)/10,xp:L.xp,words:L.kb.length};

function recordAnswer(skill, ok, weight=1){
  const L=S.L; L.recent.push(ok?1:0); if(L.recent.length>30) L.recent.shift();
  const acc=avg(L.recent);
  if(ok){ L.diff=clamp(L.diff+(acc>=0.75 && L.recent.length>=8 ? 0.7 : 0.25)*weight,0,100); L.xp+=Math.round(10*weight); }
  else L.diff=clamp(L.diff-0.35*weight,0,100);

}
function addKB(items, topic){
  const L=S.L; const have=new Set(L.kb.map(k=>norm(k.de))); let n=0;
  for(const it of items){ if(!it||!it.de) continue; const key=norm(it.de); if(!key||have.has(key)) continue; have.add(key);
    L.kb.push({id:rid(),de:String(it.de).trim(),en:String(it.en||'').trim(),t:String(it.de).trim().split(/\s+/).length>3?'s':'w',topic:topic||'',added:today(),box:0,due:today(),seen:0,ok:0}); n++; }
  if(L.kb.length>1500) L.kb=L.kb.slice(-1500);

}
function reviewKB(id, ok){ const k=S.L.kb.find(x=>x.id===id); if(!k) return; k.seen++; if(ok){ k.ok++; k.box=Math.min(5,k.box+1); } else k.box=0; k.due=addDays(today(),[0,1,2,4,8,16][k.box]); }
const dueKB = () => S.L.kb.filter(k=>k.due<=today());
function harvest(q){ // keep a record of German covered in questions
  const items=[];
  if(q.type==='spell') items.push({de:q.say,en:q.en});
  if(q.type==='speak') items.push({de:q.text,en:q.en});
  if(q.type==='order') items.push({de:q.answer,en:q.en});
  if(q.type==='translate') items.push({de:q.answer,en:q.prompt});
  if(q.type==='article') items.push({de:q.answer+' '+q.word,en:q.en});

}

function runQuiz(box,{title,questions,context,kind,onDone,timed}){
  const L=S.L; const qs=questions.filter(validQ); const res=[]; let i=0; let deadline=timed?Date.now()+timed*1000:null; let tick=null;
  if(!S.activity) beginActivity(kind||'practice');
  const dots=h('div',{class:'dots','aria-hidden':'true'});
  const timerEl=timed?h('span',{class:'timer'}):null;
  const body=h('div',{class:'q'});

  if(timed){ tick=setInterval(()=>{ const left=Math.max(0,Math.ceil((deadline-Date.now())/1000)); timerEl.textContent='0:'+String(left).padStart(2,'0'); if(left<=0){ clearInterval(tick); finish(); } },250); }

  function answered(status, detail){
    const q=qs[i]; const ok=status!=='wrong';
    recordAnswer(q.skill||'vocab', status==='right' || (status==='almost' && q.type!=='spell'), status==='almost'?0.5:1);
    if(q.kb) reviewKB(q.kb, status==='right'); else addKB(harvest(q), kind==='lesson'?'':'challenge');
    res.push(status); save();
    if(timed){ i++; if(Date.now()<deadline) next(); return; }
    drawDots();
    const fb=feedback(q,status,detail);
    const nb=h('button',{class:'btn primary',type:'button',onclick:()=>{ i++; next(); }}, i+1<qs.length?'Weiter →':'See my grade');
    body.append(fb, h('div',null,nb)); nb.focus();

    const pct=Math.round(score/total*100); const g=note(pct);
    if(kind!=='lesson') endActivity(pct); else { endActivity(pct); }
    save(true);
    const missed=qs.filter((q,j)=>res[j]&&res[j]!=='right');
    box.replaceChildren(h('div',{class:'q'},
      h('h2',null,title+': done!'),
      h('div',{class:'row',style:'gap:20px'}, h('div',{class:'grade',style:`color:${pct>=67?'var(--go)':pct>=50?'var(--wait)':'var(--stop)'}`},g.n),
        h('div',null,h('b',null,`Note ${g.n}: ${g.w}`),h('p',{class:'muted'},timed?`${res.filter(r=>r==='right').length} correct in ${timed} seconds`:`${Math.round(score*10)/10} of ${total} points (${pct}%)`),
          h('p',{class:'small muted'},'German school grades go from 1 (sehr gut) to 6 (ungenügend).'))),
      h('p',null, pct>=80?'Super gemacht! Lotte is turning the difficulty up a notch.':pct>=50?'Gut! A bit more practice and this will stick.':'Kein Problem. Mistakes are how we learn; these items will come back in your rehearsals.'),
      missed.length?h('div',{style:'display:grid;gap:6px'},h('h3',null,'To practise again'),...missed.map(q=>{ const de=answerText(q); return h('div',{class:'line'},de?sayBtn(de):null,h('div',{class:'txt'},h('span',{class:'de'},de||q.prompt),h('span',{class:'small muted'},q.en||q.prompt||''))); })):null,
      h('div',{class:'row'}, h('button',{class:'btn primary',type:'button',onclick:()=>{ if(onDone) onDone(pct,res); else location.hash='#home'; }}, onDone?'Continue':'Back to home'))));
    if(onDone && kind==='lesson'){ onDone(pct,res); box.querySelector('.btn.primary').textContent='Back to home'; box.querySelector('.btn.primary').onclick=()=>{ location.hash='#home'; }; }
  }
  next();
}
function answerText(q){ if(q.type==='mc'||q.type==='listen') return q.say||null; if(q.type==='article') return q.answer+' '+q.word; if(q.type==='fill') return q.prompt.replace(/_{2,}/,q.answer).replace(/\s*\([^)]*\)\s*$/,''); if(q.type==='translate'||q.type==='order') return q.answer; if(q.type==='spell') return q.say; if(q.type==='speak') return q.text; return null; }
function feedback(q,status,detail){
  const t={right:pick(['Richtig!','Super!','Genau!','Klasse!','Toll gemacht!']),almost:pick(['Fast!','Beinahe!','Knapp daneben!']),wrong:pick(['Leider nicht.','Nicht ganz.','Hoppla!'])}[status];
  const ans=answerText(q);
  return h('div',{class:'fb '+status,role:'status'}, h('b',{class:'t'},t), detail?h('p',null,detail):null,
    (status!=='right'&&ans)?h('div',{class:'line'},sayBtn(ans),h('div',{class:'txt'},h('span',{class:'small muted'},'Correct answer'),h('span',{class:'de'},ans))):null,
    (status!=='right'&&(q.type==='mc'||q.type==='listen'))?h('p',null,'Answer: ',h('b',null,q.options[q.answer])):null,
    q.explain?h('p',{class:'small'},q.explain):null);
}
function umlautBar(input){ return h('div',{class:'umlauts'},['ä','ö','ü','ß','Ä','Ö','Ü'].map(ch=>h('button',{type:'button',onclick:()=>{ const s=input.selectionStart??input.value.length, e=input.selectionEnd??s; input.value=input.value.slice(0,s)+ch+input.value.slice(e); input.focus(); input.setSelectionRange(s+1,s+1); }},ch))); }
function renderQ(q, done){

    wrap.append(h('p',{class:'muted'},'der, die or das?'), h('div',{class:'row',style:'justify-content:center'},sayBtn(q.word),h('span',{class:'bigword'},q.word)), q.en?h('p',{class:'muted',style:'text-align:center'},q.en):null);

    if(q.type==='spell'){ wrap.append(h('p',{class:'prompt'},'Listen and spell the word'), h('div',{class:'row'},sayPair(q.say),h('span',{class:'muted'},q.en?`(${q.en})`:''), q.hint?h('span',{class:'chip'},'Hint: '+q.hint):null)); setTimeout(()=>Voice.speak(q.say),250); }

      if(targets.some(t=>loose(t)===loose(v))) return finish('almost','Watch the umlauts or ß: you wrote "'+v+'".');

    setTimeout(()=>inp.focus(),50);
  } else if(q.type==='order'){
    const words=q.answer.trim().split(/\s+/); let pool=shuffle(words.map((w,k)=>({w,k}))); if(pool.every((p,k)=>p.k===k)) pool=pool.reverse();

    const draw=()=>{ line.replaceChildren(...chosen.map((p,k)=>h('button',{class:'tile',type:'button',onclick:()=>{ chosen.splice(k,1); pool.push(p); draw(); }},p.w)));
      poolEl.replaceChildren(...pool.map((p,k)=>h('button',{class:'tile',type:'button',onclick:()=>{ pool.splice(k,1); chosen.push(p); draw(); }},p.w))); };

      h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick:()=>{ if(pool.length) return toast('Use all the tiles first.'); const v=chosen.map(p=>p.w).join(' '); finish(norm(v)===norm(q.answer)?'right':'wrong', norm(v)===norm(q.answer)?null:'You built: "'+v+'"'); Voice.speak(q.answer); }},'Check'),

  }

}

/* ---------------- Practice ---------------- */
function viewPractice(){
  const L=S.L; const due=dueKB().length; const area=h('section',{class:'sheet'},h('h2',null,'Pick a challenge'),h('p',{class:'muted'},`Mixes ${L.kb.length?'items from your word bank with ':''}brand-new questions at ${cefr(L.diff).label}.`));
  const grid=h('div',{class:'grid3'}, Object.entries(MODES).map(([id,m])=>h('button',{class:'mode',type:'button',onclick:()=>startMode(id,area)},h('b',null,m.t),h('span',{class:'small muted'},id==='rehearsal'?`${due} due now · ${m.d}`:m.d))));
  area.append(offlineNote(), grid);
  mount(area);
  if(pendingMode){ const m=pendingMode; pendingMode=null; startMode(m,area); }
}
async function startMode(id, area){
  const m=MODES[id]; const L=S.L;
  area.replaceChildren(loadingSheet('Lotte mischt die Karten … (building your challenge)'));
  let fromKB=[];
  const due=shuffle(dueKB()); const pool=due.length?due:(id==='rehearsal'?[...L.kb].sort((a,b)=>a.box-b.box).slice(0,12):[]);
  const filt = {artikel:k=>/^(der|die|das)\s/i.test(k.de), spelling:k=>k.t==='w', pron:()=>true, puzzle:k=>k.t==='s'}[id];
  for(const k of pool){ if(fromKB.length>=m.kb) break; if(filt && !filt(k)) continue; let q=kbQuestion(k);
    if(id==='artikel'){ const a=k.de.match(/^(der|die|das)\s+(.+)$/i); q={kb:k.id,type:'article',skill:'grammar',word:a[2],en:k.en,answer:a[1].toLowerCase()}; }
    if(id==='spelling') q={kb:k.id,type:'spell',skill:'vocab',say:k.de,en:k.en};
    if(id==='pron') q={kb:k.id,type:'speak',skill:'speaking',text:k.de,en:k.en};
    if(id==='puzzle') q={kb:k.id,type:'order',skill:'grammar',answer:k.de,en:k.en};
    if(validQ(q)) fromKB.push(q); }
  let fresh=[]; const need=m.n-fromKB.length;
  if(need>0){ try{ fresh=await aiQuestions(id,need); }catch(e){ if(AI.ok||e.code!=='offline') toast(AI.why(e)); fresh=bankQuestions(id,need); } }
  const qs=id==='rehearsal'?fromKB.concat(fresh):shuffle(fromKB.concat(fresh));
  if(!qs.length){ area.replaceChildren(h('h2',null,m.t),h('p',null,'Nothing to practise yet. Do a lesson first!'),h('a',{class:'btn primary',href:'#lesson'},'Go to lesson')); return; }
  const box=h('div'); area.replaceChildren(box);
  runQuiz(box,{title:m.t,questions:qs,kind:'practice:'+id,timed:m.timed,onDone:()=>viewPractice()});
}

const SCENES=[['Free conversation','social'],['At the bakery','social'],['Meeting the neighbours','social'],['At the doctor\'s','social'],['Stammtisch at the pub','social'],['Job interview','business'],['Team meeting','business'],['Customer phone call','business'],['Salary negotiation','business'],['Asking for help at the Bürgeramt','social']];
let chatState=null;
function viewCoach(){
  const L=S.L;
  if(!chatState||chatState.for!==L.id) chatState={for:L.id,scene:L.mix>=50?SCENES[6]:SCENES[0],turns:[],msgs:[],showEn:true,auto:true};

      h('div',{class:'msg lotte'},h('div',{class:'row',style:'gap:8px;flex-wrap:nowrap;align-items:flex-start'},sayBtn(m.de),h('span',{class:'de'},m.de)),
        cs.showEn&&m.en?h('span',{class:'en'},m.en):null, m.correction?h('span',{class:'corr'},m.correction):null, m.tip?h('span',{class:'tip'},m.tip):null,
        m.newWords&&m.newWords.length?h('span',{class:'small muted'},'Added to word bank: '+m.newWords.map(w=>w.de).join(', ')):null)));
    if(!cs.msgs.length) log.append(h('p',{class:'muted'},AI.ok?'Press "Start the scene" and Lotte opens the role-play.':'Talking to Lotte needs Claude. Open this page on claude.ai and allow Claude to use it.'));

async function mockTask(mod, ex, area){

        ctx=h('div',{class:'sheet',style:'border-style:dashed'},h('b',null,r.title||''),h('p',{class:'small muted'},(r.instructions||'')+' In the real exam you may hear it once or twice.'),
